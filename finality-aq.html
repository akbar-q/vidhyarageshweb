<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finality • AQ</title>
  <meta name="description" content="A dark finality page featuring Cultist Selfie and a closing message from AQ." />
  <meta name="view-transition" content="same-origin" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #e8e4f7;
      --muted: #b5afcf;
      --card: rgba(18, 14, 34, 0.86);
      --line: rgba(171, 154, 232, 0.28);
      --glow: 0 24px 55px rgba(6, 4, 14, 0.65);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Space Mono", monospace;
      background:
        radial-gradient(circle at 18% 12%, rgba(88, 67, 144, 0.35), transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(69, 47, 104, 0.3), transparent 42%),
        linear-gradient(165deg, #05050b 0%, #0b0915 45%, #14102a 100%);
      display: grid;
      place-items: center;
      padding: 24px 16px 46px;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.2;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(940px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--glow);
      overflow: hidden;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 4, 12, 0.5);
    }

    .title {
      margin: 0;
      font-family: "Cinzel", serif;
      letter-spacing: 0.08em;
      font-size: clamp(1.1rem, 1.6vw + 0.8rem, 1.7rem);
    }

    .home-link {
      text-decoration: none;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.06);
    }

    .top-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    figure {
      margin: 0;
      padding: 22px 22px 10px;
    }

    img {
      width: 100%;
      max-height: 72vh;
      object-fit: contain;
      display: block;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #0f0d1d;
    }

    blockquote {
      margin: 0;
      padding: 20px 24px 24px;
      font-family: "Cinzel", serif;
      font-size: clamp(1.05rem, 1.3vw + 0.95rem, 1.6rem);
      line-height: 1.45;
      color: rgba(232, 228, 247, 0.68);
      text-wrap: balance;
    }

    .sig {
      display: block;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      font-family: "Space Mono", monospace;
    }

    .countdown {
      margin: 0;
      padding: 0 24px 16px;
      color: var(--muted);
      font-size: 0.63rem;
      letter-spacing: 0.09em;
      opacity: 0.45;
      text-align: right;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="page">
    <header class="top">
      <h1 class="title">Finality</h1>
      <div class="top-links">
        <a class="home-link" href="./index.html">Continue to Home</a>
        <a class="home-link" href="./extras.html">Back to Extras</a>
      </div>
    </header>

    <figure>
      <img src="./womens-day/photos/Cultist%20Selfie.jpg" alt="Cultist Selfie" />
    </figure>

    <blockquote>
      “Well I guess that was the last time anyone is ever gonna see me”
      <span class="sig">— AQ</span>
    </blockquote>

    <p class="countdown" data-april-countdown>apr.01 • --</p>
  </main>

  <script>
    (function initAprilCountdown() {
      const target = document.querySelector("[data-april-countdown]");
      if (!target) return;

      function getNextAprilFirst(now) {
        const year = now.getFullYear();
        const aprilFirst = new Date(year, 3, 1, 0, 0, 0, 0);
        if (now < aprilFirst) return aprilFirst;
        return new Date(year + 1, 3, 1, 0, 0, 0, 0);
      }

      function render() {
        const now = new Date();
        const end = getNextAprilFirst(now);
        const delta = end.getTime() - now.getTime();
        if (delta <= 0) {
          target.textContent = "apr.01 • 0d";
          return;
        }

        const totalSeconds = Math.floor(delta / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        target.textContent = `apr.01 • ${days}d ${hours}h`;
      }

      render();
      window.setInterval(render, 1000);
    })();
  </script>
</body>
</html>
